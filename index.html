<!DOCTYPE html>
<html lang="en">
<head>
  <title>Rock Paper Scissors</title>
  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      color: white;
    }

    h1 {
      margin-top: 40px;
    }

    .container {
      background: white;
      color: black;
      width: 320px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 20px;
    }

    button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .rock { background: #ff6a6a; }
    .paper { background: #5dade2; }
    .scissors { background: #55efc4; }
    .reset { background: black; color: white; }

    .result, .score {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      background: #f1f2f6;
      color: black;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Rock Paper Scissors</h1>

  <div class="container">

    <button class="rock" onclick="playerMove('rock')">Rock</button>
    <button class="paper" onclick="playerMove('paper')">Paper</button>
    <button class="scissors" onclick="playerMove('scissors')">Scissors</button>
    <button class="reset" onclick="resetScore()">Reset Score</button>

    <!-- RESULT DISPLAY -->
    <div class="result" id="result">Play the game!</div>

    <!-- SCORE DISPLAY -->
    <div class="score" id="score"></div>

  </div>

  <script>
    let score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0,
      ties: 0
    };

    updateScore();

    function playerMove(playerChoice) {
      const computerMove = pickComputerMove();
      let result = '';

      if (playerChoice === 'rock') {
        if (computerMove === 'rock') result = 'Tie';
        else if (computerMove === 'paper') result = 'Computer Wins';
        else result = 'You Win';
      }

      else if (playerChoice === 'paper') {
        if (computerMove === 'rock') result = 'You Win';
        else if (computerMove === 'paper') result = 'Tie';
        else result = 'Computer Wins';
      }

      else if (playerChoice === 'scissors') {
        if (computerMove === 'rock') result = 'Computer Wins';
        else if (computerMove === 'paper') result = 'You Win';
        else result = 'Tie';
      }

      // Update score
      if (result === 'You Win') score.wins++;
      else if (result === 'Computer Wins') score.losses++;
      else score.ties++;

      localStorage.setItem('score', JSON.stringify(score));

      // Update UI
      document.getElementById('result').innerText =
        `You: ${playerChoice} | Computer: ${computerMove} → ${result}`;

      updateScore();
    }

    function pickComputerMove() {
      const random = Math.random();

      if (random < 1/3) return 'rock';
      else if (random < 2/3) return 'paper';
      else return 'scissors';
    }

    function updateScore() {
      document.getElementById('score').innerText =
        `Wins: ${score.wins} | Losses: ${score.losses} | Ties: ${score.ties}`;
    }

    function resetScore() {
      score = { wins: 0, losses: 0, ties: 0 };
      localStorage.setItem('score', JSON.stringify(score));

      document.getElementById('result').innerText = "Score reset!";
      updateScore();
    }
  </script>

</body>
</html>
